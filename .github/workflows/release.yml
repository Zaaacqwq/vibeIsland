name: Release DMG

# Push a tag like v1.2.0 to build, Developer ID sign, notarize, staple, and
# publish a DMG. Keep the bundle ID and Sparkle EdDSA key stable across the
# migration from the historical self-signed release identity.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-appcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build & Package
    # macos-15's newest Xcode is 26.3, which links against the macOS 26.2 SDK.
    # macos-26 carries Xcode 26.5/26.6 and the 26.5 SDK.
    runs-on: macos-26
    env:
      SIGNING_IDENTITY: "Developer ID Application: ZIYUE CHEN (66M8FY87U6)"
      TEAM_ID: 66M8FY87U6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned, not `latest-stable`, for two reasons.
          #
          # AppKit and SwiftUI gate behaviour on the SDK an app was *linked*
          # against, so the toolchain is part of what ships. Releases built on
          # macos-15 linked the macOS 26.2 SDK and were noticeably less
          # responsive on a 26.4 machine — hover, close and tab switches all
          # lagged — while the identical commit built locally against the 26.5
          # SDK was not. 26.5 is the version that was verified good.
          #
          # And `latest-stable` floats with the runner image, so the SDK a
          # release links against could change without a commit touching this
          # repo. Pinning keeps releases reproducible.
          xcode-version: '26.5'

      - name: Import signing certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_CERTIFICATE_BASE64"
          test -n "$DEVELOPER_ID_CERTIFICATE_PASSWORD"

          CERTIFICATE_PATH="$RUNNER_TEMP/vibeisland-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vibeisland-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F "\"$SIGNING_IDENTITY\""

      - name: Build (Release, consistently signed)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=0.0.0
          fi
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -resultBundlePath BuildResults.xcresult \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.zaaacqwq.VibeIsland.dev \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Sign embedded code for notarization
        run: |
          APP="build/Build/Products/Release/VibeIsland.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          SPARKLE_CURRENT="$SPARKLE/Versions/Current"
          MEDIA_REMOTE="$APP/Contents/Resources/MediaRemoteAdapter.framework"

          # Xcode's build action signs the app and framework wrappers but does
          # not re-sign Sparkle's nested helper executables. Sign inside out;
          # re-sign the app last because these changes alter its resource seal.
          for component in \
            "$SPARKLE_CURRENT/XPCServices/Installer.xpc" \
            "$SPARKLE_CURRENT/XPCServices/Downloader.xpc" \
            "$SPARKLE_CURRENT/Autoupdate" \
            "$SPARKLE_CURRENT/Updater.app" \
            "$SPARKLE" \
            "$MEDIA_REMOTE" \
            "$APP"; do
            test -e "$component"
            codesign --force --sign "$SIGNING_IDENTITY" \
              --timestamp --options runtime \
              --preserve-metadata=identifier,entitlements \
              "$component"
          done

      - name: Verify signature
        run: |
          APP="build/Build/Products/Release/VibeIsland.app"
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -Fx "Authority=$SIGNING_IDENTITY"
          codesign -dvv "$APP" 2>&1 | grep -Fx "TeamIdentifier=$TEAM_ID"
          codesign -dvv "$APP" 2>&1 | grep -F 'flags=0x10000(runtime)'
          codesign -dvv "$APP" 2>&1 | grep -F 'Timestamp='
          if codesign -d --entitlements :- "$APP" 2>/dev/null \
            | grep -q '<key>com.apple.security.get-task-allow</key>'; then
            echo 'Release app must not contain get-task-allow.' >&2
            exit 1
          fi

      - name: Package DMG
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=0.0.0
          fi
          APP="build/Build/Products/Release/VibeIsland.app"
          test -d "$APP"

          STAGING="$(mktemp -d)/VibeIsland"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "VibeIsland" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "VibeIsland-$VERSION.dmg"

          codesign --sign "$SIGNING_IDENTITY" --timestamp \
            --identifier com.zaaacqwq.VibeIsland.dev.dmg \
            "VibeIsland-$VERSION.dmg"
          codesign --verify --strict "VibeIsland-$VERSION.dmg"

      - name: Notarize and staple DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          test -n "$NOTARY_APPLE_ID"
          test -n "$NOTARY_APP_PASSWORD"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=0.0.0
          fi
          DMG="VibeIsland-$VERSION.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --timeout 2h --output-format json \
            > "$RUNNER_TEMP/notarization.json"

          if ! jq -e '.status == "Accepted"' "$RUNNER_TEMP/notarization.json"; then
            SUBMISSION_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/notarization.json")"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$NOTARY_APPLE_ID" \
                --password "$NOTARY_APP_PASSWORD" \
                --team-id "$TEAM_ID" \
                "$RUNNER_TEMP/notarization-log.json" || true
              cat "$RUNNER_TEMP/notarization-log.json" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict "$DMG"
          spctl --assess --type open \
            --context context:primary-signature --verbose "$DMG"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VibeIsland $VERSION" \
            --generate-notes \
            "VibeIsland-$VERSION.dmg" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "VibeIsland-$VERSION.dmg"

      - name: Generate signed Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"

          VERSION="${GITHUB_REF_NAME#v}"
          UPDATES_DIR="$RUNNER_TEMP/vibeisland-updates"
          mkdir -p "$UPDATES_DIR"

          # Seed from main, not from this tag's checkout.
          #
          # A tag is normally cut before CI has pushed the *previous* release's
          # appcast commit, so the copy inside the tag lags main. Since the
          # publish step below overwrites main with whatever is generated here,
          # seeding from the stale copy silently drops the entries main had
          # gained in between — v1.2.0 lost the 1.1.5 entry exactly that way.
          git fetch --depth=1 origin main
          if ! git show origin/main:Updates/appcast.xml > "$UPDATES_DIR/appcast.xml" 2>/dev/null; then
            cp Updates/appcast.xml "$UPDATES_DIR/appcast.xml"
          fi
          cp "VibeIsland-$VERSION.dmg" "$UPDATES_DIR/"

          GENERATOR="$(find build/SourcePackages/artifacts -type f -name generate_appcast -print -quit)"
          test -x "$GENERATOR"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATOR" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            -o "$UPDATES_DIR/appcast.xml" \
            "$UPDATES_DIR"

          xmllint --noout "$UPDATES_DIR/appcast.xml"
          mv "$UPDATES_DIR/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      - name: Publish Sparkle appcast
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git checkout -B release-appcast origin/main
          cp "$RUNNER_TEMP/appcast.xml" Updates/appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Updates/appcast.xml

          if git diff --cached --quiet; then
            echo "Appcast is already current."
          else
            git commit -m "chore(updates): publish $GITHUB_REF_NAME appcast"
            git push origin HEAD:main
          fi

      - name: Surface failure diagnostics
        if: failure()
        run: |
          xcrun xcresulttool get build-results --path BuildResults.xcresult 2>/dev/null \
            || echo "No xcresult available."
