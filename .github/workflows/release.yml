name: Release DMG

# Push a tag like v1.2.0 to build an ad-hoc-signed DMG and attach it to a
# GitHub release. The app is not notarized (no paid developer account), so
# first launch requires System Settings > Privacy & Security > Open Anyway —
# documented in the ReadMe install section.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-appcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build & Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, ad-hoc signed)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -resultBundlePath BuildResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Package DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Build/Products/Release/VibeIsland.app"
          test -d "$APP"

          STAGING="$(mktemp -d)/VibeIsland"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "VibeIsland" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "VibeIsland-$VERSION.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VibeIsland $VERSION" \
            --generate-notes \
            "VibeIsland-$VERSION.dmg" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "VibeIsland-$VERSION.dmg"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"

          VERSION="${GITHUB_REF_NAME#v}"
          UPDATES_DIR="$RUNNER_TEMP/vibeisland-updates"
          mkdir -p "$UPDATES_DIR"
          cp Updates/appcast.xml "$UPDATES_DIR/appcast.xml"
          cp "VibeIsland-$VERSION.dmg" "$UPDATES_DIR/"

          GENERATOR="$(find build/SourcePackages/artifacts -type f -name generate_appcast -print -quit)"
          test -x "$GENERATOR"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATOR" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            -o "$UPDATES_DIR/appcast.xml" \
            "$UPDATES_DIR"

          xmllint --noout "$UPDATES_DIR/appcast.xml"
          mv "$UPDATES_DIR/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      - name: Publish Sparkle appcast
        run: |
          git fetch origin main
          git checkout -B release-appcast origin/main
          cp "$RUNNER_TEMP/appcast.xml" Updates/appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Updates/appcast.xml

          if git diff --cached --quiet; then
            echo "Appcast is already current."
          else
            git commit -m "chore(updates): publish $GITHUB_REF_NAME appcast"
            git push origin HEAD:main
          fi

      - name: Surface failure diagnostics
        if: failure()
        run: |
          xcrun xcresulttool get build-results --path BuildResults.xcresult 2>/dev/null \
            || echo "No xcresult available."
